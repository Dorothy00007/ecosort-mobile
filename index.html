<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSort</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icon (iOS အတွက်) -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background: #14213D;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #14213D;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        #loading img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        #loading p {
            color: #06D6A0;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #2A3B5C;
            border-top: 4px solid #06D6A0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top:20px;">♻️ EcoSort</p>
    </div>

    <!-- Streamlit App -->
    <iframe id="appFrame" src="https://YOUR_APP_NAME.streamlit.app/"></iframe>

    <script>
        // iframe Load ပြီးရင် Loading Screen ကိုဖျက်မယ်
        document.getElementById('appFrame').addEventListener('load', function() {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        });
    </script>
</body>
</html>
