<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; height: 100vh; background: #14213D; }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #14213D;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #2A3B5C;
            border-top: 4px solid #06D6A0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading p {
            color: #06D6A0;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>♻️ EcoSort</p>
    </div>

    <!-- 
        ⚠️ ဒီနေရာမှာ ခင်ဗျားရဲ့ Streamlit App Link ကိုထည့်ပါ
        ဥပမာ — https://YOUR_APP_NAME.streamlit.app
    -->
    <iframe id="appFrame" src="https://eco-sort-a.streamlit.app/"></iframe>

    <script>
        document.getElementById('appFrame').addEventListener('load', function() {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        });
    </script>
</body>
</html>
